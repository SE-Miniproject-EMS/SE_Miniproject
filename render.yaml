# Fresh academic demo. Render Free PostgreSQL expires after 30 days.
databases:
  - name: ems-demo-db
    plan: free
    databaseName: ems_demo
    user: ems_demo

services:
  - type: web
    name: ems-demo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ems-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_VERIFICATION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        sync: false
      - key: SESSION_IDLE_TIMEOUT_SECONDS
        value: "1800"
      - key: NOTIFICATION_ADAPTER
        value: console

  - type: web
    name: ems-demo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

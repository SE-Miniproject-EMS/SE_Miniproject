name: Work item / backlog issue
description: Record an implementation, testing, documentation or verification task with traceability.
title: "[AREA] "
labels: []
body:
  - type: input
    id: requirement
    attributes:
      label: SRS requirement / parent issue
      description: Add REQ/NFR identifier and related GitHub issue(s).
      placeholder: "REQ-xx / NFR-xx / #123"
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: Objective / user story
      description: Explain what needs to be delivered and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use testable checkboxes. Do not mark evidence complete before execution.
      value: |
        - [ ] Implementation merged
        - [ ] Unit/integration tests added and passing
        - [ ] Frontend build/browser check completed where applicable
        - [ ] Security/authorization reviewed where applicable
        - [ ] Documentation and evidence updated
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Backend
        - Frontend
        - Testing / QA
        - CI / DevOps
        - Documentation
        - Security
        - Performance
        - Operations
    validations:
      required: true
  - type: input
    id: sprint
    attributes:
      label: Sprint / iteration
      placeholder: "Sprint 1, Sprint 2 or product backlog"
  - type: input
    id: story-points
    attributes:
      label: Story points
      placeholder: "Use agreed team estimate"
  - type: textarea
    id: ownership
    attributes:
      label: Owner(s) and responsibilities
      description: Distinguish implementation, testing, documentation and reviewer roles.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / dependencies
      description: List PR, branch, test command, expected artifacts, blockers or external dependencies.
